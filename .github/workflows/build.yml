name: Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact_name: dark-white-mode-windows
            release_asset: dist/dark-white-mode.exe
          - name: macOS
            os: macos-latest
            artifact_name: dark-white-mode-macos
            release_asset: dist/dark-white-mode-macos.zip

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run self-test
        run: python dark_white_mode.py --self-test

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python dark_white_mode.py --make-icon assets/dark-white-mode.ico
          python -m PyInstaller --noconfirm --clean --onefile --windowed --icon assets/dark-white-mode.ico --name dark-white-mode dark_white_mode.py
          $hash = (Get-FileHash dist/dark-white-mode.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  dark-white-mode.exe" | Set-Content -Encoding ascii dist/dark-white-mode.exe.sha256

      - name: Build macOS icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python dark_white_mode.py --make-icon assets/dark-white-mode.png
          iconset="assets/dark-white-mode.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/dark-white-mode.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            doubled=$((size * 2))
            sips -z "$doubled" "$doubled" assets/dark-white-mode.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o assets/dark-white-mode.icns

      - name: Build macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name dark-white-mode \
            --icon assets/dark-white-mode.icns \
            --osx-bundle-identifier com.guyhouri.dark-white-mode \
            dark_white_mode.py
          icon_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' dist/dark-white-mode.app/Contents/Info.plist)"
          test -n "$icon_name"
          test -f "dist/dark-white-mode.app/Contents/Resources/$icon_name"

      - name: Validate macOS release signing configuration
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          exit "$missing"

      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/dark-white-mode-signing.p12"
          keychain_path="$RUNNER_TEMP/dark-white-mode-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          echo "CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$keychain_password" >> "$GITHUB_ENV"
          CERTIFICATE_PATH="$certificate_path" python -c "import base64, os, pathlib; pathlib.Path(os.environ['CERTIFICATE_PATH']).write_bytes(base64.b64decode(os.environ['APPLE_CERTIFICATE_P12']))"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

      - name: Sign macOS app
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          codesign --force --deep --strict --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" dist/dark-white-mode.app
          codesign --verify --deep --strict --verbose=2 dist/dark-white-mode.app

      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --keepParent dist/dark-white-mode.app dist/dark-white-mode-macos.zip

      - name: Notarize and staple macOS app
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool submit dist/dark-white-mode-macos.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple dist/dark-white-mode.app
          rm -f dist/dark-white-mode-macos.zip
          ditto -c -k --keepParent dist/dark-white-mode.app dist/dark-white-mode-macos.zip
          codesign --verify --deep --strict --verbose=2 dist/dark-white-mode.app
          xcrun stapler validate dist/dark-white-mode.app
          spctl --assess --type execute --verbose=4 dist/dark-white-mode.app

      - name: Write macOS checksum
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist
          shasum -a 256 dark-white-mode-macos.zip > dark-white-mode-macos.zip.sha256

      - name: Clean up macOS signing keychain
        if: always() && runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [[ -n "${CERTIFICATE_PATH:-}" ]]; then
            rm -f "$CERTIFICATE_PATH"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.release_asset }}
            ${{ matrix.release_asset }}.sha256
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --title "$TAG_NAME" --generate-notes
          gh release upload "$TAG_NAME" --repo "$GITHUB_REPOSITORY" release-assets/* --clobber
