name: Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact_name: dark-white-mode-windows
            release_asset: dist/dark-white-mode.exe
          - name: macOS
            os: macos-latest
            artifact_name: dark-white-mode-macos
            release_asset: dist/dark-white-mode-macos.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run self-test
        run: python dark_white_mode.py --self-test

      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name dark-white-mode dark_white_mode.py

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name dark-white-mode dark_white_mode.py
          ditto -c -k --keepParent dist/dark-white-mode.app dist/dark-white-mode-macos.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.release_asset }}

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_ASSET: ${{ matrix.release_asset }}
        shell: bash
        run: gh release upload "$TAG_NAME" "$RELEASE_ASSET" --clobber
