name: Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact_name: dark-white-mode-windows
            release_asset: dist/dark-white-mode.exe
          - name: macOS
            os: macos-15
            artifact_name: dark-white-mode-macos
            release_asset: dist/dark-white-mode-macos.zip

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run self-test
        run: python dark_white_mode.py --self-test

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python dark_white_mode.py --make-icon assets/dark-white-mode.ico
          python -m PyInstaller --noconfirm --clean --onefile --windowed --icon assets/dark-white-mode.ico --name dark-white-mode dark_white_mode.py
          $hash = (Get-FileHash dist/dark-white-mode.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  dark-white-mode.exe" | Set-Content -Encoding ascii dist/dark-white-mode.exe.sha256

      - name: Build macOS icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python dark_white_mode.py --make-icon assets/dark-white-mode.png
          iconset="assets/dark-white-mode.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/dark-white-mode.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            doubled=$((size * 2))
            sips -z "$doubled" "$doubled" assets/dark-white-mode.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o assets/dark-white-mode.icns

      - name: Build macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name dark-white-mode \
            --icon assets/dark-white-mode.icns \
            --osx-bundle-identifier com.guyhouri.dark-white-mode \
            dark_white_mode.py
          icon_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' dist/dark-white-mode.app/Contents/Info.plist)"
          test -n "$icon_name"
          test -f "dist/dark-white-mode.app/Contents/Resources/$icon_name"

      - name: Smoke-test packaged macOS app on a real Mac runner
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bash -n install-macos.command
          bash install-macos.command --check-flux
          sw_vers
          uname -m
          executable="dist/dark-white-mode.app/Contents/MacOS/dark-white-mode"
          file "$executable"

          runtime_result="$RUNNER_TEMP/dark-white-mode-runtime-smoke.json"
          DARK_WHITE_MODE_SMOKE_OUTPUT="$runtime_result" "$executable" --macos-runtime-smoke-test
          cat "$runtime_result"
          python -c "import json, sys; data=json.load(open(sys.argv[1])); assert data['ok'], data" "$runtime_result"

          gui_result="$RUNNER_TEMP/dark-white-mode-gui-smoke.json"
          EXECUTABLE="$executable" GUI_RESULT="$gui_result" python - <<'PY'
          import os
          import subprocess

          environment = dict(os.environ)
          environment["DARK_WHITE_MODE_SMOKE_OUTPUT"] = os.environ["GUI_RESULT"]
          subprocess.run(
              [os.environ["EXECUTABLE"], "--macos-gui-smoke-test"],
              check=True,
              env=environment,
              timeout=45,
          )
          PY
          cat "$gui_result"
          python -c "import json, sys; data=json.load(open(sys.argv[1])); assert data['ok'], data" "$gui_result"
          codesign --verify --deep --strict --verbose=2 dist/dark-white-mode.app

      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          package_directory="dist/dark-white-mode-macos"
          mkdir -p "$package_directory"
          ditto dist/dark-white-mode.app "$package_directory/dark-white-mode.app"
          cp install-macos.command "$package_directory/Install-dark-white-mode.command"
          cp MAC_INSTALL.txt "$package_directory/READ-ME-FIRST.txt"
          chmod +x "$package_directory/Install-dark-white-mode.command"
          ditto -c -k --keepParent "$package_directory" dist/dark-white-mode-macos.zip
          cp install-macos.command dist/Install-dark-white-mode.command
          chmod +x dist/Install-dark-white-mode.command
          standalone_directory="dist/Install-dark-white-mode"
          mkdir -p "$standalone_directory"
          cp install-macos.command "$standalone_directory/Install-dark-white-mode.command"
          cp MAC_INSTALL.txt "$standalone_directory/READ-ME-FIRST.txt"
          chmod +x "$standalone_directory/Install-dark-white-mode.command"
          ditto -c -k --sequesterRsrc --keepParent "$standalone_directory" dist/Install-dark-white-mode.zip
          installer_check="$RUNNER_TEMP/dark-white-mode-installer-zip"
          mkdir -p "$installer_check"
          ditto -x -k dist/Install-dark-white-mode.zip "$installer_check"
          extracted_installer="$installer_check/Install-dark-white-mode/Install-dark-white-mode.command"
          test -f "$extracted_installer"
          chmod +x "$extracted_installer"
          bash "$extracted_installer" --help >/dev/null

      - name: Write macOS checksum
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd dist
          shasum -a 256 dark-white-mode-macos.zip > dark-white-mode-macos.zip.sha256
          shasum -a 256 Install-dark-white-mode.command > Install-dark-white-mode.command.sha256
          shasum -a 256 Install-dark-white-mode.zip > Install-dark-white-mode.zip.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.release_asset }}
            ${{ matrix.release_asset }}.sha256
          if-no-files-found: error

      - name: Upload one-file macOS installer artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dark-white-mode-macos-installer
          path: |
            dist/Install-dark-white-mode.command
            dist/Install-dark-white-mode.command.sha256
            dist/Install-dark-white-mode.zip
            dist/Install-dark-white-mode.zip.sha256
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --title "$TAG_NAME" --generate-notes
          gh release upload "$TAG_NAME" --repo "$GITHUB_REPOSITORY" release-assets/* --clobber
